[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gecko-hide-generator"
version = "0.1.0"
description = "Deterministic CadQuery generator for printable gecko hides"
requires-python = ">=3.11"
dependencies = [
    "cadquery>=2.5,<2.7",
    "numpy>=1.26",
    "trimesh>=4.4",
    "matplotlib>=3.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
